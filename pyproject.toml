[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romanrecoverer"
version = "0.1.0"
description = "Injection-and-recovery benchmarks for Nancy Grace Roman WFI source-detection catalogues."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Plygonality" }]
keywords = ["astronomy", "roman", "wfi", "injection-recovery", "completeness"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "astropy>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
science = ["photutils>=1.12", "pyarrow>=14"]
roman = ["romanisim==0.15.0", "roman_datamodels>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
romanrecoverer = "romanrecoverer.cli:main"

[project.urls]
Documentation = "https://romanisim.readthedocs.io/en/latest/romanisim/image.html"
Source = "https://github.com/Plygonality/RomanRecover"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
